name: Bootstrap Hestiat

on:
  push:
    branches:
      - main

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Hestiat
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP found"
            exit 0
          fi

          mkdir -p /tmp/hestiat
          unzip -q "$ZIP" -d /tmp/hestiat

          if [ -f "/tmp/hestiat/package.json" ]; then
            ROOT="/tmp/hestiat"
          else
            ROOT=$(find /tmp/hestiat -mindepth 1 -maxdepth 1 -type d | head -1)
          fi

          cp -a "$ROOT"/. .

          rm -f "$ZIP"
          rm -f ".github/workflows/bootstrap.yml"

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Bootstrap Hestiat project"
          git push
