# Vista de prueba de la web solar en 127.0.0.1:3999 (solo local, para revisar por túnel SSH).
# No responde a hestiat.com. Se activa con: desplegar.sh probar

server {
    listen 127.0.0.1:3999;
    server_name _;

    root /var/www/hestiat-solar/preview;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
