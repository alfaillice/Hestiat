services:
  - type: web
    name: hestiat
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true

  - type: worker
    name: hestiat-events
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run worker:events
    autoDeploy: true

  - type: keyvalue
    name: hestiat-redis
    plan: starter
    ipAllowList: []

  - type: pserv
    name: hestiat-db
    runtime: docker
    plan: starter
    dockerCommand: postgres
    envVars:
      - key: POSTGRES_DB
        value: hestiat
      - key: POSTGRES_USER
        value: hestiat
      - key: POSTGRES_PASSWORD
        generateValue: true
