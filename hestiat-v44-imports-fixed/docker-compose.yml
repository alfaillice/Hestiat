services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hestiat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hestiat
      POSTGRES_PASSWORD: hestiat
      POSTGRES_DB: hestiat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestiat -d hestiat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hestiat_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hestiat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - hestiat_redis:/data

volumes:
  hestiat_postgres:
  hestiat_redis:
