name: Validar Hestiat Next.js

on:
  push:
    branches:
      - nueva-web
    paths:
      - "frontend/**"
      - ".github/workflows/validar-hestiat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-hestiat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Comprobar TypeScript
        run: npm run typecheck
      - name: Ejecutar pruebas unitarias
        run: npm run test:unit
      - name: Compilar Next.js
        run: npm run build
      - name: Empaquetar release para VPS
        run: |
          test -f .next/standalone/server.js
          mkdir -p "$RUNNER_TEMP/hestiat-release/.next"
          cp -a .next/standalone/. "$RUNNER_TEMP/hestiat-release/"
          cp -a .next/static "$RUNNER_TEMP/hestiat-release/.next/static"
          cp -a public "$RUNNER_TEMP/hestiat-release/public"
          tar -czf "$RUNNER_TEMP/hestiat-release.tgz" -C "$RUNNER_TEMP/hestiat-release" .
          sha256sum "$RUNNER_TEMP/hestiat-release.tgz" > "$RUNNER_TEMP/hestiat-release.sha256"
      - name: Guardar paquete verificable sin secretos
        uses: actions/upload-artifact@v4
        with:
          name: hestiat-vps-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hestiat-release.tgz
            ${{ runner.temp }}/hestiat-release.sha256
          retention-days: 7
