# hestiat.com — sitio estático de dimensionamiento solar (Astro).
# Sirve la release apuntada por /var/www/hestiat-solar/current (symlink).
# No toca shop.hestiat.com, newtimes.news, correo ni DNS.

server {
    listen 80;
    listen [::]:80;
    server_name hestiat.com www.hestiat.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://hestiat.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hestiat.com;

    ssl_certificate     /etc/letsencrypt/live/hestiat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hestiat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://hestiat.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hestiat.com;

    ssl_certificate     /etc/letsencrypt/live/hestiat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hestiat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/hestiat-solar/current;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/json text/xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Páginas HTML: se revalidan siempre (así un despliegue se ve al momento).
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Estáticos con hash o de /img y /_astro: cache larga.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    access_log /var/log/nginx/hestiat-solar-access.log;
    error_log  /var/log/nginx/hestiat-solar-error.log;
}
