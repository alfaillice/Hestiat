name: Import V44.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V44.1
        run: |
          set -e

          ZIP="hestiat-v44.1-imports-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP"
            exit 1
          fi

          rm -rf /tmp/hestiat-v44
          mkdir -p /tmp/hestiat-v44

          unzip -q "$ZIP" -d /tmp/hestiat-v44

          ROOT="/tmp/hestiat-v44"

          if [ -d "$ROOT/hestiat-v43-staging-db-validated" ]; then
            ROOT="$ROOT/hestiat-v43-staging-db-validated"
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -a "$ROOT"/. .

          rm -f "$ZIP"

      - name: Commit V44.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Import Hestiat V44.1 with fixed imports" || echo "No changes to commit"

          git push
