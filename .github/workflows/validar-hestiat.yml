name: Validar Hestiat Next.js

on:
  push:
    branches:
      - nueva-web
    paths:
      - "frontend/**"
      - ".github/workflows/validar-hestiat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-hestiat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Comprobar TypeScript
        run: npm run typecheck
      - name: Ejecutar pruebas unitarias
        run: npm run test:unit
      - name: Compilar Next.js
        run: npm run build
