# Hestiat — configuración de nginx (copia de referencia del servidor)
#
# LO QUE SE AÑADE EN ESTA FASE: caché pública por tipo de contenido.
#
#   · Contenido informativo y legal   → 30 minutos (cambia muy poco)
#   · Portada y listados públicos     → 5 minutos  (moderado; hay catálogo y recuentos)
#   · Estáticos de la aplicación      → 1 año, inmutable (ya estaba)
#   · Sitemap                         → 1 hora (ya estaba)
#
#   · Datos privados, sesión, paneles, reservas y disponibilidad → SIN CACHÉ, siempre en vivo.
#     No es una lista de exclusiones: solo se cachea lo que aparece aquí, así que todo lo demás
#     (favoritos, panel de anfitrión, administración, reservas, /api/*) sigue yendo al servidor.
#
#   · SI LA PETICIÓN LLEVA SESIÓN, NO SE CACHEA NADA: se comprueba la cookie `hestiat_sesion` en
#     `proxy_cache_bypass` y en `proxy_no_cache`. Un usuario con sesión nunca recibe una página
#     guardada, y su respuesta personalizada nunca se guarda.
#   · SI LA PETICIÓN LLEVA PARÁMETROS (filtros, búsqueda, paginación), NO SE CACHEA: cada combinación
#     de filtros es distinta y llenaría la caché de basura.
#
#   · INVALIDACIÓN: la caché se vacía en cada despliegue (ver scripts/purgar-cache-vps.sh) y, además,
#     cada entrada caduca sola en 5 o 30 minutos. Nunca se sirve algo más viejo que eso.

server {
    listen 80;
    listen [::]:80;
    server_name hestiat.com www.hestiat.com 104.243.34.239;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hestiat.com www.hestiat.com 104.243.34.239;

    ssl_certificate     /etc/letsencrypt/live/hestiat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hestiat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 30m;

    include /etc/nginx/snippets/hestiat-seguridad.conf;

    # El sitemap se genera en el servidor en cada petición (10.000 URLs): se cachea una hora.
    location = /sitemap.xml {
        include /etc/nginx/snippets/hestiat-seguridad.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache hestiat_cache;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Portada: 5 minutos, solo sin sesión y sin parámetros ---
    location = / {
        include /etc/nginx/snippets/hestiat-seguridad.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache hestiat_cache;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_bypass $cookie_hestiat_sesion $hestiat_con_parametros;
        proxy_no_cache $cookie_hestiat_sesion $hestiat_con_parametros;
        add_header X-Cache $upstream_cache_status always;
    }

    # --- Listados públicos: 5 minutos, solo sin sesión y sin parámetros ---
    location ~ ^/(experiencias|servicios|destinos)/?$ {
        include /etc/nginx/snippets/hestiat-seguridad.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache hestiat_cache;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_bypass $cookie_hestiat_sesion $hestiat_con_parametros;
        proxy_no_cache $cookie_hestiat_sesion $hestiat_con_parametros;
        add_header X-Cache $upstream_cache_status always;
    }

    # --- Páginas informativas y legales: 30 minutos ---
    location ~ ^/(ayuda|como-funciona|como-reservar|cancelaciones|seguridad|sobre|contacto|preguntas-frecuentes|aviso-legal|privacidad|cookies|condiciones-uso|condiciones-anfitrion|normas-comunidad|hazte-anfitrion|publicar-experiencia|publicar-servicio)/?$ {
        include /etc/nginx/snippets/hestiat-seguridad.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache hestiat_cache;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 30m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_bypass $cookie_hestiat_sesion $hestiat_con_parametros;
        proxy_no_cache $cookie_hestiat_sesion $hestiat_con_parametros;
        add_header X-Cache $upstream_cache_status always;
    }

    # --- Todo lo demás: en vivo, sin caché (paneles, sesión, reservas, disponibilidad, /api/*) ---
    location / {
        include /etc/nginx/snippets/hestiat-seguridad.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    access_log /var/log/hestiat/nginx-access.log;
    error_log  /var/log/hestiat/nginx-error.log;
}
