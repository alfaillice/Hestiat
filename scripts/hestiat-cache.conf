# Hestiat — variables de caché pública
#
# `hestiat_con_parametros` vale 1 cuando la petición trae cualquier parámetro de consulta
# (filtros, búsqueda, paginación) y 0 cuando no trae ninguno. Se usa en `proxy_cache_bypass`
# y `proxy_no_cache`, de forma que las vistas filtradas NUNCA se cachean: cada combinación es
# distinta y llenaría la caché de entradas que no sirven a nadie.
map $args $hestiat_con_parametros {
    default 1;
    ""      0;
}

proxy_cache_path /var/cache/nginx/hestiat levels=1:2 keys_zone=hestiat_cache:10m max_size=200m inactive=60m use_temp_path=off;
